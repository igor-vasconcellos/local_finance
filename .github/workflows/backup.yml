name: Backup do banco (produção)

# Cópia semanal do banco de produção, CRIPTOGRAFADA com uma senha só sua.
# O plano gratuito do Supabase não faz backup automático.
#
# Para ativar, cadastre em GitHub → Settings → Secrets and variables → Actions:
#   BACKUP_DATABASE_URL  → a "Session pooler" (porta 5432) do projeto de PRODUÇÃO
#   BACKUP_PASSPHRASE    → uma senha forte para criptografar (guarde num lugar seguro!)
#
# Para restaurar:  gpg -d beaconfinance-AAAA-MM-DD.sql.gz.gpg | gunzip | psql "<url do banco>"

on:
  schedule:
    - cron: "23 6 * * 1" # segunda-feira, 03:23 em Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Verificar segredos
        id: check
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "Segredos de backup não configurados; nada a fazer."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Instalar pg_dump 17
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Gerar cópia criptografada
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          FILE="beaconfinance-$(date -u +%F).sql.gz.gpg"
          /usr/lib/postgresql/17/bin/pg_dump "$BACKUP_DATABASE_URL" --no-owner --no-privileges --schema=public \
            | gzip -9 \
            | gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 -o "$FILE"
          echo "FILE=$FILE" >> "$GITHUB_ENV"
          ls -lh "$FILE"
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.skip != 'true'
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 90
