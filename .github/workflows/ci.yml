name: CI

on:
  pull_request:
    branches: [main, homologacao]
  push:
    branches: [main, homologacao]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacoes:
    name: Verificações (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SESSION_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-123
      DATABASE_PATH: ./data/ci.db
      MAIL_MODE: console
      EMAIL_MX_CHECK: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # .npmrc tem ignore-scripts=true; o better-sqlite3 já traz binários prontos (prebuilds/).
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
